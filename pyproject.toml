[project]
name = "appli"
version = "0.1.0"
description = "appli using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.175.0,<1.0.0"
    , "fastapi>=0.111.0,<1.0.0"
    , "uvicorn[standard]>=0.30.0,<1.0.0"
    , "pandas>=2.0.0,<3.0.0"
    , "requests>=2.31.0,<3.0.0"
    , "python-multipart>=0.0.9,<1.0.0"
]

[project.scripts]
appli = "appli.main:run"
run_crew = "appli.main:run"
train = "appli.main:train"
replay = "appli.main:replay"
test = "appli.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
